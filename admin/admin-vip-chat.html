<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VIP 단체채팅 관리</title><link rel="stylesheet" href="../shared/vip.css?v=20260923-1"><style>
.chat-admin-layout{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:11px;height:calc(100vh - 44px)}.members{overflow:auto;padding:12px}.member-row{display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid #eef1f4}.member-row .vip-person{flex:1}@media(max-width:900px){.chat-admin-layout{grid-template-columns:1fr;height:auto}.members{max-height:420px}}
</style></head><body>
<div class="vip-shell"><aside class="vip-side"><div class="vip-brand">AI 프로세스 VIP<small>ADMIN CONSOLE</small></div><nav class="vip-nav"><a class="" href="admin-vip.html">VIP 대시보드</a><a class="active" href="admin-vip-chat.html">단체채팅 관리</a><a class="" href="admin-vip-support.html">1:1 상담 관리<span id="navBadgeAdmin" class="badge hidden"></span></a><a class="" href="admin-vip-events.html">이벤트 관리</a><a href="admin_dashboard.html">투자 관리</a><a href="admin-running.html">진행중 투자</a></nav></aside><main class="vip-main" style="padding-bottom:10px"><div class="chat-admin-layout">
<section class="vip-chat-shell"><div class="vip-chat-head"><div><strong>VIP 단체채팅 관리</strong><small>메시지 삭제 가능 · 일반 메시지는 푸시 알림 없음</small></div></div><div id="chatList" class="vip-chat-list"></div><div class="vip-compose"><div class="compose-row"><input id="file" type="file" accept="image/*" hidden><button id="photoBtn" class="compose-icon">＋</button><textarea id="message" placeholder="관리자 메시지를 입력하세요."></textarea><button id="sendBtn" class="compose-send">전송</button></div></div></section>
<aside class="vip-card members"><div class="vip-section-head"><h2>VIP 회원</h2><small id="memberCount">0명</small></div><div id="members"></div></aside>
</div></main></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="../shared/config.js?v=20260923-1"></script>
<script src="../shared/sb.js?v=20260923-1"></script>
<script src="../shared/app.js?v=20260923-1"></script>
<script src="../shared/vip-push-config.js?v=20260923-1"></script>
<script src="../shared/vip.js?v=20260923-1"></script>
<script src="../shared/vip-notify.js?v=20260923-1"></script>

<script>
const admin=AIVIP.requireAdmin(),sb=AIVIP.sb();let messages=[],profiles=[],channel=null;
async function loadMessages(){const r=await sb.from('vip_group_messages').select('*,app_users!vip_group_messages_sender_user_id_fkey(name,username),vip_profiles!vip_group_messages_sender_user_id_fkey(nickname,avatar_key)').order('created_at',{ascending:true}).limit(250);if(r.error)throw r.error;messages=r.data||[];document.getElementById('chatList').innerHTML=messages.length?messages.map(m=>{if(m.message_type==='system'||m.sender_role==='system')return `<div class="msg-system">${AIVIP.escape(m.body||'')}</div>`;const name=m.sender_role==='admin'?'관리자':(m.vip_profiles?.nickname||m.app_users?.name||m.app_users?.username||'VIP');return `<div class="msg ${m.sender_role==='admin'?'mine admin':''}"><div class="vip-avatar sm">${m.sender_role==='admin'?'👑':AIVIP.escape(m.vip_profiles?.avatar_key||'🐼')}</div><div class="msg-body"><div class="msg-name">${AIVIP.escape(name)}</div><div class="msg-bubble">${m.is_deleted?'<span style="color:#99a2ad">삭제된 메시지입니다.</span>':AIVIP.escape(m.body||'')}${!m.is_deleted&&m.image_url?`<img class="msg-photo" src="${AIVIP.escape(m.image_url)}" onclick="window.open(this.src,'_blank')">`:''}</div><div class="msg-time">${AIVIP.time(m.created_at)}</div>${!m.is_deleted?`<div class="msg-tools"><button onclick="deleteMsg('${m.id}')">관리자 삭제</button></div>`:''}</div></div>`}).join(''):'<div class="vip-empty">메시지가 없습니다.</div>';const el=document.getElementById('chatList');el.scrollTop=el.scrollHeight}
window.deleteMsg=async id=>{if(!confirm('이 메시지를 삭제하시겠습니까?'))return;await sb.from('vip_group_messages').update({is_deleted:true,deleted_at:new Date().toISOString(),deleted_by:'admin',body:null,image_url:null}).eq('id',id)};
async function loadMembers(){const r=await sb.from('vip_profiles').select('*,app_users!vip_profiles_user_id_fkey(username,name)').order('created_at');if(r.error)throw r.error;profiles=r.data||[];document.getElementById('memberCount').textContent=profiles.length+'명';document.getElementById('members').innerHTML=profiles.map(p=>`<div class="member-row"><div class="vip-person"><div class="vip-avatar sm">${AIVIP.escape(p.avatar_key||'🐼')}</div><div class="vip-person-text"><strong>${AIVIP.escape(p.nickname)}</strong><small>${AIVIP.escape(p.app_users?.username||'')} · ${p.group_kicked?'강퇴됨':'정상'}</small></div></div><button class="vip-btn ${p.group_kicked?'':'red'}" onclick="toggleKick('${p.user_id}',${p.group_kicked})">${p.group_kicked?'강퇴 해제':'강퇴'}</button></div>`).join('')}
window.toggleKick=async(id,kicked)=>{if(!confirm(kicked?'강퇴를 해제하시겠습니까?':'VIP 단체채팅에서 강퇴하시겠습니까?'))return;const r=await sb.from('vip_profiles').update({group_kicked:!kicked,updated_at:new Date().toISOString()}).eq('user_id',id);if(r.error)return alert(r.error.message);const p=profiles.find(x=>x.user_id===id);await sb.from('vip_group_messages').insert({sender_role:'system',message_type:'system',body:`${p?.nickname||'회원'}님이 관리자에 의해 ${kicked?'강퇴 해제되었습니다.':'퇴장되었습니다.'}`});await loadMembers()};
async function send(imageUrl=null){const body=document.getElementById('message').value.trim();if(!body&&!imageUrl)return;const r=await sb.from('vip_group_messages').insert({sender_user_id:admin?.id||null,sender_role:'admin',message_type:imageUrl?'image':'text',body:body||null,image_url:imageUrl});if(r.error)return alert(r.error.message);document.getElementById('message').value=''}
document.getElementById('sendBtn').onclick=()=>send();document.getElementById('message').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}};document.getElementById('photoBtn').onclick=()=>document.getElementById('file').click();document.getElementById('file').onchange=async e=>{const f=e.target.files?.[0];if(!f)return;try{await send(await AIVIP.uploadImage(f,'group-admin'))}catch(err){alert(err.message)}e.target.value=''};
(async()=>{await Promise.all([loadMessages(),loadMembers()]);channel=sb.channel('vip-admin-group').on('postgres_changes',{event:'*',schema:'public',table:'vip_group_messages'},()=>loadMessages()).on('postgres_changes',{event:'UPDATE',schema:'public',table:'vip_profiles'},()=>loadMembers()).subscribe()})().catch(e=>alert('VIP SQL 설정을 확인해주세요. · '+e.message));
</script></body></html>
