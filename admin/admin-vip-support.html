<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VIP 1:1 상담 관리</title><link rel="stylesheet" href="../shared/vip.css?v=20260923-1"><style>
.support-layout{display:grid;grid-template-columns:290px minmax(360px,1fr) 280px;height:calc(100vh - 44px);background:#fff;border:1px solid var(--vip-line);border-radius:15px;overflow:hidden}
.thread-panel{border-right:1px solid var(--vip-line);overflow:auto}.thread-head{padding:13px;border-bottom:1px solid var(--vip-line);position:sticky;top:0;background:#fff;z-index:2}.thread-head input{width:100%;border:1px solid var(--vip-line);border-radius:9px;padding:9px;font-size:11px}
.thread{padding:11px 12px;border-bottom:1px solid #eef1f4;cursor:pointer;display:flex;gap:9px}.thread:hover,.thread.active{background:#f3f7fb}.thread-info{min-width:0;flex:1}.thread-info strong{display:block;font-size:12px}.thread-info small{display:block;font-size:10px;color:#8792a0;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.thread-unread{min-width:20px;height:20px;border-radius:10px;background:#ef476f;color:#fff;font-size:10px;display:flex;align-items:center;justify-content:center}
.chat-panel{min-width:0;display:grid;grid-template-rows:auto minmax(0,1fr) auto}.member-panel{border-left:1px solid var(--vip-line);overflow:auto;padding:14px;background:#fafbfc}
@media(max-width:1050px){.support-layout{grid-template-columns:250px minmax(350px,1fr)}.member-panel{display:none}}
@media(max-width:720px){.support-layout{grid-template-columns:1fr;height:auto;min-height:calc(100vh - 100px)}.thread-panel{max-height:230px;border-right:0;border-bottom:1px solid var(--vip-line)}.chat-panel{min-height:600px}}
</style></head><body>
<div class="vip-shell"><aside class="vip-side"><div class="vip-brand">AI 프로세스 VIP<small>ADMIN CONSOLE</small></div><nav class="vip-nav"><a class="" href="admin-vip.html">VIP 대시보드</a><a class="" href="admin-vip-chat.html">단체채팅 관리</a><a class="active" href="admin-vip-support.html">1:1 상담 관리<span id="navBadgeAdmin" class="badge hidden"></span></a><a class="" href="admin-vip-events.html">이벤트 관리</a><a href="admin_dashboard.html">투자 관리</a><a href="admin-running.html">진행중 투자</a></nav></aside><main class="vip-main" style="padding-bottom:10px">
<div class="support-layout">
<div class="thread-panel"><div class="thread-head"><input id="search" placeholder="회원 이름 / 아이디 검색"></div><div id="threads"></div></div>
<div class="chat-panel"><div class="vip-chat-head"><div><strong id="chatTitle">상담을 선택해주세요</strong><small id="chatStatus">대기 · 상담중 · 완료</small></div><div class="vip-actions"><button id="btnNotify" class="vip-btn">🔔 알림</button><button id="btnSound" class="vip-btn">🔊 알람</button><select id="status" class="vip-btn"><option>대기</option><option>상담중</option><option>완료</option></select></div></div><div id="chatList" class="vip-chat-list"><div class="vip-empty">왼쪽에서 상담을 선택해주세요.</div></div><div class="vip-compose"><div class="compose-row"><input id="file" type="file" accept="image/*" hidden><button id="photoBtn" class="compose-icon">＋</button><textarea id="message" placeholder="답변을 입력하세요."></textarea><button id="sendBtn" class="compose-send">전송</button></div></div></div>
<aside class="member-panel"><div id="memberInfo" class="vip-empty">회원 정보</div></aside>
</div></main></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="../shared/config.js?v=20260923-1"></script>
<script src="../shared/sb.js?v=20260923-1"></script>
<script src="../shared/app.js?v=20260923-1"></script>
<script src="../shared/vip-push-config.js?v=20260923-1"></script>
<script src="../shared/vip.js?v=20260923-1"></script>
<script src="../shared/vip-notify.js?v=20260923-1"></script>

<script>
const admin=AIVIP.requireAdmin(),sb=AIVIP.sb();let threads=[],selected=null,messages=[],channel=null;
async function loadThreads(){
 const r=await sb.from('vip_support_threads').select('*,app_users!vip_support_threads_user_id_fkey(id,username,name,amount,realized_amount,status),vip_profiles!vip_support_threads_user_id_fkey(nickname,avatar_key,group_kicked)').order('last_message_at',{ascending:false,nullsFirst:false});if(r.error)throw r.error;threads=r.data||[];renderThreads();
 const wanted=new URLSearchParams(location.search).get('thread');if(!selected&&wanted)selectThread(wanted);else if(!selected&&threads[0])selectThread(threads[0].id);
}
function renderThreads(){const q=document.getElementById('search').value.trim().toLowerCase();const list=threads.filter(t=>!q||[t.vip_profiles?.nickname,t.app_users?.name,t.app_users?.username].some(v=>String(v||'').toLowerCase().includes(q)));document.getElementById('threads').innerHTML=list.length?list.map(t=>`<div class="thread ${selected?.id===t.id?'active':''}" onclick="selectThread('${t.id}')"><div class="vip-avatar sm">${AIVIP.escape(t.vip_profiles?.avatar_key||'🐼')}</div><div class="thread-info"><strong>${AIVIP.escape(t.vip_profiles?.nickname||t.app_users?.name||t.app_users?.username)}</strong><small>${t.status} · ${AIVIP.time(t.last_message_at||t.created_at)}</small></div>${t.unread_admin?`<span class="thread-unread">${t.unread_admin}</span>`:''}</div>`).join(''):'<div class="vip-empty">상담이 없습니다.</div>'}
window.selectThread=async id=>{selected=threads.find(x=>x.id===id);if(!selected)return;renderThreads();await sb.from('vip_support_threads').update({unread_admin:0}).eq('id',id);document.getElementById('chatTitle').textContent=selected.vip_profiles?.nickname||selected.app_users?.name||selected.app_users?.username;document.getElementById('status').value=selected.status;await loadMessages();await loadMember()};
async function loadMessages(){const r=await sb.from('vip_support_messages').select('*').eq('thread_id',selected.id).order('created_at',{ascending:true}).limit(300);if(r.error)throw r.error;messages=r.data||[];document.getElementById('chatList').innerHTML=messages.length?messages.map(m=>`<div class="msg ${m.sender_role==='admin'?'mine admin':''}"><div class="vip-avatar sm">${m.sender_role==='admin'?'👑':AIVIP.escape(selected.vip_profiles?.avatar_key||'🐼')}</div><div class="msg-body"><div class="msg-name">${m.sender_role==='admin'?'관리자':AIVIP.escape(selected.vip_profiles?.nickname||'회원')}</div><div class="msg-bubble">${m.is_deleted?'<span style="color:#99a2ad">삭제된 메시지입니다.</span>':AIVIP.escape(m.body||'')}${!m.is_deleted&&m.image_url?`<img class="msg-photo" src="${AIVIP.escape(m.image_url)}" onclick="window.open(this.src,'_blank')">`:''}</div><div class="msg-time">${AIVIP.time(m.created_at)}</div>${!m.is_deleted?`<div class="msg-tools"><button onclick="deleteSupport('${m.id}')">삭제</button></div>`:''}</div></div>`).join(''):'<div class="vip-empty">메시지가 없습니다.</div>';const el=document.getElementById('chatList');el.scrollTop=el.scrollHeight}
window.deleteSupport=async id=>{if(!confirm('관리자 권한으로 메시지를 삭제하시겠습니까?'))return;await sb.from('vip_support_messages').update({is_deleted:true,deleted_at:new Date().toISOString(),deleted_by:'admin',body:null,image_url:null}).eq('id',id)};
async function loadMember(){const u=selected.app_users,p=selected.vip_profiles;const inv=await sb.from('app_investments').select('display_name,processor_code,amount,realized_amount,status,started_at').eq('user_id',u.id).order('created_at',{ascending:false}).limit(10);document.getElementById('memberInfo').innerHTML=`<div class="vip-person">${AIVIP.avatar(p)}<div class="vip-person-text"><strong>${AIVIP.escape(p?.nickname||u.name||u.username)}</strong><small>${AIVIP.escape(u.username)}</small></div></div><div class="vip-list" style="margin-top:14px"><div class="vip-row"><div class="vip-row-main"><strong>누적 수익</strong><small>${AIVIP.money(u.realized_amount)}</small></div></div>${(inv.data||[]).map(i=>`<div class="vip-row"><div class="vip-row-main"><strong>${AIVIP.escape(i.display_name||'AI 프로세스')}</strong><small>${i.status} · ${AIVIP.money(i.amount)} · 수익 ${AIVIP.money(i.realized_amount)}</small></div></div>`).join('')}</div><div class="field" style="margin-top:12px"><label>관리자 메모</label><textarea id="adminNote">${AIVIP.escape(selected.admin_note||'')}</textarea></div><button class="vip-btn" style="margin-top:7px" onclick="saveNote()">메모 저장</button>`}
window.saveNote=async()=>{const note=document.getElementById('adminNote').value;await sb.from('vip_support_threads').update({admin_note:note}).eq('id',selected.id);selected.admin_note=note;alert('저장되었습니다.')};
async function send(imageUrl=null){if(!selected)return;const body=document.getElementById('message').value.trim();if(!body&&!imageUrl)return;const r=await sb.from('vip_support_messages').insert({thread_id:selected.id,sender_user_id:admin?.id||null,sender_role:'admin',message_type:imageUrl?'image':'text',body:body||null,image_url:imageUrl});if(r.error)return alert(r.error.message);document.getElementById('message').value=''}
document.getElementById('sendBtn').onclick=()=>send();document.getElementById('message').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}};document.getElementById('photoBtn').onclick=()=>document.getElementById('file').click();document.getElementById('file').onchange=async e=>{const f=e.target.files?.[0];if(!f)return;try{await send(await AIVIP.uploadImage(f,'support-admin'))}catch(err){alert(err.message)}e.target.value=''};
document.getElementById('status').onchange=async e=>{if(!selected)return;await sb.from('vip_support_threads').update({status:e.target.value}).eq('id',selected.id);selected.status=e.target.value};
document.getElementById('search').oninput=renderThreads;document.getElementById('btnNotify').onclick=async()=>{await AIVIPNotify.requestPermission()};document.getElementById('btnSound').onclick=()=>{AIVIPNotify.enableSound();alert('새 1:1 문의 알람음을 켰습니다.')};
(async()=>{await loadThreads();channel=sb.channel('vip-admin-support').on('postgres_changes',{event:'*',schema:'public',table:'vip_support_messages'},()=>{loadThreads();if(selected)loadMessages()}).on('postgres_changes',{event:'*',schema:'public',table:'vip_support_threads'},()=>loadThreads()).subscribe()})().catch(e=>alert('VIP SQL 설정을 확인해주세요. · '+e.message));
</script></body></html>
