<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VIP 단체채팅</title><link rel="stylesheet" href="../shared/vip.css?v=20260923-1"></head><body>
<div class="vip-shell"><aside class="vip-side"><div class="vip-brand">AI 프로세스 VIP<small>PRIVATE COMMUNITY</small></div><nav class="vip-nav"><a class="" href="index.html">홈</a><a class="active" href="chat.html">VIP 단체채팅</a><a class="" href="events.html">이벤트</a><a class="" href="support.html">1:1 상담<span id="navBadgeSupport" class="badge hidden"></span></a><a class="" href="profile.html">프로필 / 알림</a><a href="../user/dashboard.html">AI 프로세스</a></nav></aside><main class="vip-main" style="padding-bottom:10px">
<div id="kicked" class="error-bar hidden">관리자에 의해 VIP 단체채팅 이용이 제한되었습니다.</div>
<section class="vip-chat-shell"><div class="vip-chat-head"><div><strong>VIP 단체채팅</strong><small>일반 메시지는 푸시 알림이 가지 않습니다.</small></div><div class="vip-actions"><button id="btnReload" class="vip-btn">새로고침</button></div></div>
<div id="chatList" class="vip-chat-list"><div class="vip-empty">메시지를 불러오는 중입니다.</div></div>
<div class="vip-compose"><div id="replyBar" class="compose-reply"><span id="replyText"></span><button id="cancelReply" class="vip-btn">취소</button></div><div class="compose-row"><input id="file" type="file" accept="image/*" hidden><button id="photoBtn" class="compose-icon" title="사진">＋</button><textarea id="message" placeholder="메시지를 입력하세요."></textarea><button id="sendBtn" class="compose-send">전송</button></div></div>
</section></main></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="../shared/config.js?v=20260923-1"></script>
<script src="../shared/sb.js?v=20260923-1"></script>
<script src="../shared/app.js?v=20260923-1"></script>
<script src="../shared/vip-push-config.js?v=20260923-1"></script>
<script src="../shared/vip.js?v=20260923-1"></script>
<script src="../shared/vip-notify.js?v=20260923-1"></script>

<script>
const user=AIVIP.requireUser(),sb=AIVIP.sb();let profile=null,messages=[],replyTo=null,channel=null;
function msgText(m){if(m.is_deleted)return '삭제된 메시지입니다.';return m.body||''}
function render(){
 const map=new Map(messages.map(m=>[m.id,m]));
 document.getElementById('chatList').innerHTML=messages.length?messages.map(m=>{
  if(m.message_type==='system'||m.sender_role==='system')return `<div class="msg-system">${AIVIP.escape(msgText(m))}</div>`;
  const mine=m.sender_user_id===user.id;const name=m.sender_role==='admin'?'👑 관리자':(m.vip_profiles?.nickname||m.app_users?.name||m.app_users?.username||'VIP');
  const av=m.sender_role==='admin'?'👑':(m.vip_profiles?.avatar_key||'🐼');const rep=m.reply_to?map.get(m.reply_to):null;
  return `<div class="msg ${mine?'mine':''} ${m.sender_role==='admin'?'admin':''}"><div class="vip-avatar sm">${AIVIP.escape(av)}</div><div class="msg-body"><div class="msg-name">${AIVIP.escape(name)}</div><div class="msg-bubble">${rep?`<div class="reply-box">${AIVIP.escape(msgText(rep)).slice(0,70)}</div>`:''}${m.is_deleted?'<span style="color:#99a2ad">삭제된 메시지입니다.</span>':AIVIP.escape(m.body||'')}${!m.is_deleted&&m.image_url?`<img class="msg-photo" src="${AIVIP.escape(m.image_url)}" onclick="window.open(this.src,'_blank')">`:''}</div><div class="msg-time">${AIVIP.time(m.created_at)}</div>${!m.is_deleted?`<div class="msg-tools"><button onclick="setReply('${m.id}')">답장</button>${mine?`<button onclick="deleteMsg('${m.id}')">삭제</button>`:''}</div>`:''}</div></div>`;
 }).join(''):'<div class="vip-empty">아직 메시지가 없습니다.</div>';
 const el=document.getElementById('chatList');el.scrollTop=el.scrollHeight;
}
async function load(){
 const p=await AIVIP.ensureProfile(user);profile=p;if(p.group_kicked){document.getElementById('kicked').classList.remove('hidden');document.querySelector('.vip-compose').classList.add('hidden')}
 const q=await sb.from('vip_group_messages').select('*,app_users!vip_group_messages_sender_user_id_fkey(name,username),vip_profiles!vip_group_messages_sender_user_id_fkey(nickname,avatar_key)').order('created_at',{ascending:false}).limit(80);
 if(q.error)throw q.error;messages=(q.data||[]).reverse();render();
 if(!p.first_group_join_at&&!p.group_kicked){
   await sb.from('vip_profiles').update({first_group_join_at:new Date().toISOString()}).eq('user_id',user.id);
   await sb.from('vip_group_messages').insert({sender_role:'system',message_type:'system',body:`${p.nickname}님이 VIP 채팅방에 입장했습니다.`});
 }
}
window.setReply=id=>{replyTo=id;const m=messages.find(x=>x.id===id);document.getElementById('replyText').textContent='답장 · '+msgText(m).slice(0,70);document.getElementById('replyBar').classList.add('show')};
window.deleteMsg=async id=>{if(!confirm('이 메시지를 삭제하시겠습니까?'))return;await sb.from('vip_group_messages').update({is_deleted:true,deleted_at:new Date().toISOString(),deleted_by:'user',body:null,image_url:null}).eq('id',id).eq('sender_user_id',user.id);};
document.getElementById('cancelReply').onclick=()=>{replyTo=null;document.getElementById('replyBar').classList.remove('show')};
async function send(imageUrl=null){
 const body=document.getElementById('message').value.trim();if(!body&&!imageUrl)return;
 const r=await sb.from('vip_group_messages').insert({sender_user_id:user.id,sender_role:'user',message_type:imageUrl?'image':'text',body:body||null,image_url:imageUrl,reply_to:replyTo});
 if(r.error)return alert(r.error.message);document.getElementById('message').value='';replyTo=null;document.getElementById('replyBar').classList.remove('show');
}
document.getElementById('sendBtn').onclick=()=>send();
document.getElementById('message').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}};
document.getElementById('photoBtn').onclick=()=>document.getElementById('file').click();
document.getElementById('file').onchange=async e=>{const f=e.target.files?.[0];if(!f)return;try{const url=await AIVIP.uploadImage(f,'group');await send(url)}catch(err){alert(err.message)}e.target.value=''};
document.getElementById('btnReload').onclick=()=>load().catch(console.error);
(async()=>{if(!user)return;await load();channel=sb.channel('vip-group-user').on('postgres_changes',{event:'*',schema:'public',table:'vip_group_messages'},()=>load().catch(console.error)).subscribe()})().catch(e=>alert('VIP SQL 설정을 확인해주세요. · '+e.message));
</script></body></html>
